spring.application.name=delete_products_batchjob

spring.datasource.product.driver-class-name=org.h2.Driver
spring.datasource.product.url=jdbc:h2:mem:testdb
spring.datasource.product.username=sa
spring.datasource.product.password=
spring.datasource.product.hikari.connectionTimeout=30000
spring.datasource.product.hikari.idleTimeout=600000
spring.datasource.product.hikari.maxLifetime=1800000

spring.datasource.product.hikari.maximum-pool-size=20
spring.datasource.product.hikari.minimum-idle=5
spring.datasource.product.hikari.connection-timeout=30000
spring.datasource.product.hikari.idle-timeout=600000

spring.datasource.staging.driver-class-name=org.h2.Driver
spring.datasource.staging.url=jdbc:h2:mem:testdb
spring.datasource.staging.username=sa
spring.datasource.staging.password=
spring.datasource.staging.hikari.connectionTimeout=30000
spring.datasource.staging.hikari.idleTimeout=600000
spring.datasource.staging.hikari.maxLifetime=1800000

spring.datasource.staging.hikari.maximum-pool-size=20
spring.datasource.staging.hikari.minimum-idle=5
spring.datasource.staging.hikari.connection-timeout=30000
spring.datasource.staging.hikari.idle-timeout=600000

spring.batch.initialize-schema=ALWAYS

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

spring.main.allow-bean-definition-overriding=true
server.port=${SERVER_PORT:1091}

product.service.delete-product-endpoint=http://localhost:1011/api/product/v1/delete

logging.level.org.springframework.batch=DEBUG